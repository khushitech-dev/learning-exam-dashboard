<script>

</script>
<script>
// Boot watchdog (inline on purpose - it can never be stale-cached).
(function () {
  var bootEl = document.getElementById('exam-boot');
  if (!bootEl) return;

  function content() { return document.getElementById('exam-content'); }
  function bootGone() { var c = content(); return c && !c.querySelector('#exam-boot'); }
  function rendered() {
    var c = content();
    return c && c.querySelector('.exam-h1,.exam-h2,.exam-table,.exam-subject-card,.exam-stat-tile,.exam-empty,.exam-summary-body,.exam-tabs,.exam-dropzone,.exam-form-group,.exam-card');
  }

  // Case 1: external scripts never ran (blocked / stale cache / JS error on load).
  setTimeout(function () {
    if (bootGone() || rendered()) return;
    if (bootEl) bootEl.innerHTML = '<div style="text-align:center;padding:48px 16px">' +
      '<div style="font-size:18px">⚠️ Dashboard scripts could not start</div>' +
      '<div style="margin:10px 0;color:#666">The page did not initialise. This usually means your browser is running an old cached copy of the app scripts, or the dashboard has no /api endpoint configured.</div>' +
      '<div><a href="javascript:location.reload()">↻ Reload page</a> &nbsp;·&nbsp; <a href="javascript:location.reload(true)">Hard reload</a></div>' +
      '<div style="margin-top:10px;font-size:12px;color:#666">Hosting the frontend separately? Set the API origin on the page (window.EXAM_API_BASE) before the scripts load.</div>' +
    '</div>';
  }, 6000);

  // Case 2: scripts ran but a data request never completes (stuck fetch).
  setTimeout(function () {
    if (bootGone() || rendered()) return;
    var c = content();
    if (c) c.innerHTML = '<div style="text-align:center;padding:60px 16px">' +
      '<div style="font-size:20px">⏳ Dashboard stuck loading</div>' +
      '<div style="margin:10px 0;color:#666">A data request is still pending after 15s. This is usually a temporary network block or an unreachable API origin.</div>' +
      '<div><a href="javascript:location.reload()">↻ Reload page</a> &nbsp;·&nbsp; <a href="javascript:location.reload(true)">Hard reload</a></div>' +
    '</div>';
  }, 15000);
})();
</script>
